name: jd_donuts
description: J'Donuts customer app code test implementation.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  hive_ce_flutter: ^2.3.2
  flutter_secure_storage: ^10.0.0
  connectivity_plus: ^6.1.5
  cached_network_image: ^3.4.1
  intl: ^0.20.1
  gap: ^3.0.1
  google_fonts: ^6.2.1
  collection: ^1.19.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/icons/

  
